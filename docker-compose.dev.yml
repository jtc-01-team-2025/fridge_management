version: "3.9"
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: react-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  # Viteホットリロード有効化
      - WATCHPACK_POLLING=true
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fastapi-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - app_network


  db:
    image: mysql:8.0
    container_name: fridge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fridge_db
      MYSQL_USER: fridge_user
      MYSQL_PASSWORD: fridge_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
