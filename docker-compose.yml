version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: fridge-mysql
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    # volumes:
    #   - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

# top-level でボリューム定義
volumes:
  db_data:
