version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: fridge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fridge_db
      MYSQL_USER: fridge_user
      MYSQL_PASSWORD: fridge_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
  frontend:
    image: node:20
    container_name: react-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend

# top-level でボリューム定義
volumes:
  db_data: